<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
    <link rel="stylesheet" href="aula_09_classes.css">
</head>

<body class="fundo">

    <div class="menu">
        <button class="botao">Produtos</button>
        <button class="botao">Sobre nós</button>
        <button class="botao">Contato</button>
    </div>

    <div class="cabecalho">
        <hr/>
        <h1 class="titulo">Coxinhas do Mau</h1>
        <p class="subtitulo">Salgados maiores que sua fome.</p>
        <p class="texto_apresentacao">Os melhores salgados do interior de São Paulo!</p>
        <hr/>
    </div>
    
    <h2 class="secao">Produtos</h2>

    <div class="card">
        <img class="card_imagem" src="https://placehold.co/250x250" alt="Coxinha Frango Catupiry"/>

        <p class="card_descricao">Coxinha com frango desfiado temperado recheado com requeijão catupiry</p>
        <p class="card_preco">R$12,59</p>
        <div class="card_botao_alinhamento"><button class="card_botao">Comprar</button></div>
    </div>

</body>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao CSS</title>
</head>
<body>
    <h1 style="color: green; font-size: 15px; text-align: center;">Introdução ao CSS</h1>
    <p style="color: blue; text-align: right;">O CSS é uma tecnologia para estilizar a página.</p>
    <p style="color: purple; font-size: 15px; text-align: center; background-color: darkorange;">Ele funciona em conjunto com o HTML</p>

    <button style="color: rgb(255, 255, 255); background-image: linear-gradient(180deg, red, green);">Concordo</button>
    <button style="color: rgb(255, 255, 255); background-image: radial-gradient(circle, red, blue, green);">Discordo</button>
</body>
</html>

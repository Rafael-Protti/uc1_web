<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulários</h1>

    <p>Como adicionar Inputs no HTML</p>

    <form>
        <p>Faça Login:</p>
    
        <p><input placeholder="Digite seu nome" minlength="10" maxlength="20" required></p>
    
        <p><input type="password" placeholder="Digite sua senha" minlength="10" maxlength="40" required></p>
    
        <p><button>Entrar</button></p>
    </form>
    

    <input type="text" placeholder="Cuidado">
    
</body>
</html>
